spring.application.name=vps-controller
# Local only: the API is reached on this machine; the Docker source comes through an SSH tunnel.
server.address=127.0.0.1
server.port=8080
# docker-socket-proxy on the VPS (GET only), forwarded with: ssh -N -L 2375:127.0.0.1:2375 <host>
vps.docker.base-url=${VPS_DOCKER_URL:http://127.0.0.1:2375}
vps.docker.timeout=3s

# Availability checks (V2). A missing checks file is fine: the app starts with zero checks.
vps.checks.file=${VPS_CHECKS_FILE:./checks.yml}
vps.heartbeat.url=${HEARTBEAT_URL:}
vps.telegram.base-url=${TELEGRAM_BASE_URL:https://api.telegram.org}

# Persistence: history and state live in PostgreSQL (Flyway migrates on startup).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vpscontroller}
spring.datasource.username=${DB_USER:vpscontroller}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true

# RFC 9457 problem details for framework errors too (404/400 stay consistent with the API).
spring.mvc.problemdetails.enabled=true
