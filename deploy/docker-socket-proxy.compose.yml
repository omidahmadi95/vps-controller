# Read-only Docker API for the VPS Controller (Omid). Only GET on /containers; everything else is refused.
# Reached from the laptop via: ssh -N -L 2375:127.0.0.1:23750 <server>
services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:be1ac64f33bd82043beb504822a17ba6b71668ea1ad7cf51a9a01d27bb7ab047
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:23750:2375"
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
